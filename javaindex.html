<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Progress - Home</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet" />
</head>
<body id="page-top">

  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg bg-secondary text-uppercase fixed-top" id="mainNav">
    <div class="container">
      <a class="navbar-brand" href="#page-top">Work In Progress</a>
      <button class="navbar-toggler text-uppercase font-weight-bold bg-primary text-white rounded"
               type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive"
               aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
        Menu
        <i class="fas fa-bars"></i>
      </button>
      <div class="collapse navbar-collapse" id="navbarResponsive">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link py-3 px-0 px-lg-3 rounded" href="#page-top">Home</a></li>
          <li class="nav-item"><a class="nav-link py-3 px-0 px-lg-3 rounded" href="#gallery">Gallery</a></li>
          <li class="nav-item"><a class="nav-link py-3 px-0 px-lg-3 rounded" href="#profile">Profile</a></li>
          <li class="nav-item"><a class="nav-link py-3 px-0 px-lg-3 rounded" href="#about">About</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Masthead -->
  <header class="masthead bg-primary text-white text-center">
    <div class="container d-flex align-items-center flex-column py-5">
      <img class="masthead-avatar mb-3 rounded-circle" src="assets/img/p6.jpg" alt="Profile Image" />
      <h1 class="masthead-heading text-uppercase mb-0">Record Your Progress</h1>
      <div class="divider-custom divider-light my-3">
        <div class="divider-custom-line"></div>
        <div class="divider-custom-icon"><i class="fas fa-star"></i></div>
        <div class="divider-custom-line"></div>
      </div>
      <p class="masthead-subheading font-weight-light mb-0">See the Result of Your Progress</p>
    </div>
  </header>

  <!-- Gallery Section -->
  <section id="gallery" class="page-section bg-white py-5">
    <div class="container">
      <h2 class="text-center text-uppercase text-secondary mb-5">Gallery</h2>
      <div class="row g-4">

        <!-- Photo 1 -->
        <div class="col-md-4">
          <div class="card shadow-sm gallery-card p-3 text-center">
            <p id="demo1"></p>
            <button type="button" onclick="showPhoto1()">Show Photo </button>
          </div>
        </div>

        <!-- Photo 2 -->
        <div class="col-md-4">
          <div class="card shadow-sm gallery-card p-3 text-center">
            <p id="demo2"></p>
            <button type="button" onclick="showPhoto2()">Show Photo </button>
          </div>
        </div>

        <!-- Photo 3 -->
        <div class="col-md-4">
          <div class="card shadow-sm gallery-card p-3 text-center">
            <p id="demo3"></p>
            <button type="button" onclick="showPhoto3()">Show Photo </button>
          </div>
        </div>

        <!-- Photo 4 -->
        <div class="col-md-4">
          <div class="card shadow-sm gallery-card p-3 text-center">
            <p id="demo4"></p>
            <button type="button" onclick="showPhoto4()">Show Photo </button>
          </div>
        </div>

        <!-- Photo 5 -->
        <div class="col-md-4">
          <div class="card shadow-sm gallery-card p-3 text-center">
            <p id="demo5"></p>
            <button type="button" onclick="showPhoto5()">Show Photo </button>
          </div>
        </div>

        <!-- Photo 6 -->
        <div class="col-md-4">
          <div class="card shadow-sm gallery-card p-3 text-center">
            <p id="demo6"></p>
            <button type="button" onclick="showPhoto6()">Show Photo </button>
          </div>
        </div>

      </div>
    </div>
  </section>
  <script>
    function showPhoto1() {
      document.getElementById("demo1").innerHTML =
        "<img src='assets/img/p1.jpg' alt='Photo 1' style='max-width:100%'><p>My Triceps</p>";
    }
    function showPhoto2() {
      document.getElementById("demo2").innerHTML =
        "<img src='assets/img/p2.jpg' alt='Photo 2' style='max-width:100%'><p>My Shoulder and Biceps</p>";
    }
    function showPhoto3() {
      document.getElementById("demo3").innerHTML =
        "<img src='assets/img/p3.jpg' alt='Photo 3' style='max-width:100%'><p>Flexing my Chest</p>";
    }
    function showPhoto4() {
      document.getElementById("demo4").innerHTML =
        "<img src='assets/img/p7.jpg' alt='Photo 4' style='max-width:100%'><p>Flexing my body @Skyline</p>";
    }
    function showPhoto5() {
      document.getElementById("demo5").innerHTML =
        "<img src='assets/img/p10.jpg' alt='Photo 5' style='max-width:100%'><p>With Bro's</p>";
    }
    function showPhoto6() {
      document.getElementById("demo6").innerHTML =
        "<img src='assets/img/p11.jpg' alt='Photo 6' style='max-width:100%'><p>First Flex</p>";
    }
  </script>

  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


  
</body>
</html>
